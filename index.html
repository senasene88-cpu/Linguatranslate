<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaTranslate</title>
</head>

<body>

    <h1>LinguaTranslate</h1>

    <p>Traduisez facilement entre le français, l'anglais et le mandarin.</p>

    <select>
        <option>Français</option>
        <option>Anglais</option>
        <option>Mandarin</option>
    </select>

    <br><br>

    <textarea placeholder="Écrivez votre texte ici..."></textarea>

    <br><br>

    <select>
        <option>Anglais</option>
        <option>Français</option>
        <option>Mandarin</option>
    </select>

    <br><br>

    <button>TRADUIRE</button>

</body>
</html>
